            Click below for a follow-up question.
          </p>

      // ==========================================

      function showRandomStory() {
        const randomNumber = Math.floor(Math.random() * storyPrompts.length);

        const currentStory = storyPrompts[randomNumber];

        category.textContent = currentStory.category;

        storyPrompt.textContent = currentStory.text;

        followUpCard.style.display = "block";

        followUp.textContent = "Click below for a follow-up question.";
      }

      // ==========================================
      // SHOW RANDOM FOLLOW-UP
      // ==========================================

      function showRandomFollowUp() {
        const randomNumber = Math.floor(Math.random() * followUps.length);

        followUp.textContent = followUps[randomNumber];
      }
